
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Premium Music</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252525;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.logo span { color: #19d66b; }

main {
  padding: 20px;
  text-align: center;
  padding-bottom: 45px;
}

.cover {
  width: 210px;
  height: 210px;
  margin: 35px auto 25px;
  border: 2px solid #19d66b;
  border-radius: 22px;
  background: linear-gradient(145deg, #171717, #292929);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 85px;
  color: #19d66b;
}

#songName {
  font-size: 21px;
  overflow-wrap: anywhere;
  margin-bottom: 7px;
}

#songInfo {
  color: #999;
  font-size: 14px;
}

audio { display: none; }

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 13px;
  margin: 30px 0;
}

.controls button {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: white;
  font-size: 23px;
  cursor: pointer;
}

.controls .play-button {
  width: 65px;
  height: 65px;
  background: #19d66b;
  color: #080808;
  font-size: 27px;
}

.controls button:active { opacity: .65; }

.menu-area {
  position: relative;
}

.menu-button {
  font-size: 27px !important;
}

.menu {
  display: none;
  position: absolute;
  right: 0;
  top: 48px;
  width: 220px;
  background: #202020;
  border: 1px solid #383838;
  border-radius: 12px;
  padding: 7px;
  z-index: 10;
  text-align: left;
  box-shadow: 0 8px 25px #0009;
}

.menu.show { display: block; }

.menu-item {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  padding: 14px 12px;
  text-align: left;
  font-size: 15px;
  border-radius: 7px;
  cursor: pointer;
}

.menu-item:active { background: #333; }

.timer-options {
  display: none;
  border-top: 1px solid #444;
  padding-top: 5px;
}

.timer-options.show { display: block; }

.timer-options button {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  color: #19d66b;
  padding: 11px 14px;
  text-align: left;
  font-size: 14px;
}

.add-button {
  width: 100%;
  max-width: 280px;
  padding: 14px;
  background: #19d66b;
  color: #080808;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#status {
  min-height: 20px;
  color: #999;
  font-size: 13px;
  margin-top: 15px;
}

h3 {
  text-align: left;
  margin-top: 38px;
}

#playlist {
  list-style: none;
  padding: 0;
  text-align: left;
}

#playlist li {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 9px;
  padding: 15px;
  margin-bottom: 9px;
  overflow-wrap: anywhere;
  cursor: pointer;
}

#playlist li.active {
  border-color: #19d66b;
  color: #19d66b;
}

.empty {
  color: #777;
  font-size: 13px;
  cursor: default !important;
}

</style>
</head>

<body>

<header>
  <div class="logo">PREMIUM <span>MUSIC</span></div>
  <span>🎧</span>
</header>

<main>

  <div class="cover">♫</div>

  <h2 id="songName">Nenhuma música selecionada</h2>
  <p id="songInfo">Adicione músicas do seu celular</p>

  <audio id="audioPlayer"></audio>

  <div class="controls">

    <button id="previousBtn" title="Voltar">⏮</button>

    <button id="playBtn" class="play-button" title="Reproduzir">
      ▶
    </button>

    <button id="nextBtn" title="Avançar">⏭</button>

    <button id="muteBtn" title="Mute">🔊</button>

    <div class="menu-area">
      <button id="menuBtn" class="menu-button" title="Mais opções">
        ⋮
      </button>

      <div class="menu" id="menu">

        <button class="menu-item" id="playNextBtn">
          ▶ Tocar a seguir
        </button>

        <button class="menu-item" id="timerBtn">
          ⏰ Temporizador
        </button>

        <div class="timer-options" id="timerOptions">
          <button data-minutes="5">5 minutos</button>
          <button data-minutes="10">10 minutos</button>
          <button data-minutes="15">15 minutos</button>
          <button data-minutes="20">20 minutos</button>
          <button data-minutes="30">30 minutos</button>
          <button data-minutes="0">Desativar temporizador</button>
        </div>

      </div>
    </div>

  </div>

  <input
    type="file"
    id="file"
    accept="audio/*"
    multiple
    hidden
  >

  <button class="add-button" id="addButton">
    + Adicionar músicas
  </button>

  <p id="status"></p>

  <h3>Minha biblioteca</h3>
  <ul id="playlist"></ul>

</main>

<script>
const audio = document.getElementById("audioPlayer");
const fileInput = document.getElementById("file");
const playlist = document.getElementById("playlist");
const playBtn = document.getElementById("playBtn");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const muteBtn = document.getElementById("muteBtn");
const songName = document.getElementById("songName");
const songInfo = document.getElementById("songInfo");
const status = document.getElementById("status");

const menuBtn = document.getElementById("menuBtn");
const menu = document.getElementById("menu");
const playNextBtn = document.getElementById("playNextBtn");
const timerBtn = document.getElementById("timerBtn");
const timerOptions = document.getElementById("timerOptions");

let songs = [];
let queue = [];
let currentIndex = -1;
let timer = null;

document.getElementById("addButton").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const files = Array.from(fileInput.files);

  files.forEach(file => {
    if (!file.type.startsWith("audio/")) return;

    songs.push({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: URL.createObjectURL(file)
    });
  });

  renderPlaylist();

  status.textContent = files.length
    ? "Músicas adicionadas!"
    : "Nenhuma música adicionada.";

  fileInput.value = "";
});

function renderPlaylist() {
  playlist.innerHTML = "";

  if (songs.length === 0) {
    playlist.innerHTML =
      '<li class="empty">Sua biblioteca está vazia.</li>';
    return;
  }

  songs.forEach((song, index) => {
    const li = document.createElement("li");
    li.textContent = song.name;

    if (index === currentIndex) {
      li.classList.add("active");
    }

    li.addEventListener("click", () => {
      playSong(index);
    });

    playlist.appendChild(li);
  });
}

function playSong(index) {
  if (index < 0 || index >= songs.length) return;

  currentIndex = index;
  audio.src = songs[index].url;

  songName.textContent = songs[index].name;
  songInfo.textContent = "Biblioteca do celular";

  renderPlaylist();

  audio.play().catch(() => {
    status.textContent = "Não foi possível reproduzir esta música.";
  });
}

function playNext() {
  if (queue.length > 0) {
    const nextIndex = queue.shift();
    playSong(nextIndex);
    return;
  }

  if (songs.length > 0) {
    const nextIndex = currentIndex === -1
      ? 0
      : (currentIndex + 1) % songs.length;

    playSong(nextIndex);
  }
}

playBtn.addEventListener("click", () => {
  if (songs.length === 0) {
    status.textContent = "Adicione uma música primeiro.";
    return;
  }

  if (currentIndex === -1) {
    playSong(0);
  } else if (audio.paused) {
    audio.play().catch(() => {
      status.textContent = "Não foi possível reproduzir.";
    });
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
  status.textContent = "Reproduzindo agora";
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
});

nextBtn.addEventListener("click", playNext);

previousBtn.addEventListener("click", () => {
  if (songs.length === 0) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  const previousIndex = currentIndex <= 0
    ? songs.length - 1
    : currentIndex - 1;

  playSong(previousIndex);
});

audio.addEventListener("ended", playNext);

muteBtn.addEventListener("click", () => {
  audio.muted = !audio.muted;
  muteBtn.textContent = audio.muted ? "🔇" : "🔊";
});

// Abrir e fechar o menu
menuBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  menu.classList.toggle("show");
});

document.addEventListener("click", (event) => {
  if (!event.target.closest(".menu-area")) {
    menu.classList.remove("show");
    timerOptions.classList.remove("show");
  }
});

// Tocar a seguir: adiciona a música atual à fila escondida
playNextBtn.addEventListener("click", () => {
  if (currentIndex === -1) {
    status.textContent = "Escolha uma música primeiro.";
  } else {
    queue.push(currentIndex);
    status.textContent = "Música adicionada para tocar a seguir!";
  }

  menu.classList.remove("show");
});

// Abrir opções do temporizador
timerBtn.addEventListener("click", () => {
  timerOptions.classList.toggle("show");
});

// Configurar temporizador
timerOptions.querySelectorAll("button").forEach(button => {
  button.addEventListener("click", () => {
    clearTimeout(timer);
    timer = null;

    const minutes = Number(button.dataset.minutes);

    if (minutes === 0) {
      status.textContent = "Temporizador desativado.";
    } else {
      status.textContent =
        `A música vai parar em ${minutes} minutos.`;

      timer = setTimeout(() => {
        audio.pause();
        status.textContent =
          "Temporizador finalizado. Música pausada.";
        timer = null;
      }, minutes * 60 * 1000);
    }

    menu.classList.remove("show");
    timerOptions.classList.remove("show");
  });
});

renderPlaylist();
</script>

</body>
</html>
