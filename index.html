
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Premium Music</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252525;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.logo span { color: #19d66b; }

main {
  padding: 20px;
  padding-bottom: 45px;
  text-align: center;
}

.cover {
  width: 210px;
  height: 210px;
  margin: 35px auto 25px;
  border: 2px solid #19d66b;
  border-radius: 22px;
  background: linear-gradient(145deg,#171717,#292929);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 85px;
  color: #19d66b;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#songName {
  font-size: 21px;
  overflow-wrap: anywhere;
  margin-bottom: 7px;
}

#songInfo {
  color: #999;
  font-size: 14px;
}

audio { display: none; }

/* PROGRESSO */

.progress-area {
  width: 100%;
  max-width: 450px;
  margin: 25px auto 10px;
}

.time-row {
  display: flex;
  justify-content: space-between;
  color: #999;
  font-size: 12px;
}

#progress {
  width: 100%;
  height: 5px;
  margin: 12px 0;
  accent-color: #19d66b;
  cursor: pointer;
}

/* CONTROLES */

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin: 22px auto;
  width: 100%;
}

.controls > button,
.menu-area > button {
  width: 40px;
  height: 45px;
  flex-shrink: 0;
  border: none;
  background: transparent;
  color: white;
  font-size: 21px;
  cursor: pointer;
}

.controls button.active-control {
  color: #19d66b;
}

.controls .play-button {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #19d66b;
  color: #080808;
  font-size: 25px;
}

.menu-area {
  position: relative;
  flex-shrink: 0;
}

.menu-button { font-size: 30px !important; }

/* MENUS */

.popup-menu {
  display: none;
  position: absolute;
  background: #202020;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 7px;
  z-index: 100;
  box-shadow: 0 8px 25px #0009;
}

.popup-menu.show {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.main-menu {
  top: 48px;
  right: 0;
  width: 220px;
}

.popup-option {
  display: block;
  width: 100%;
  min-height: 45px;
  padding: 13px 12px;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: white;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
}

.popup-option:active { background: #383838; }

.timer-options {
  display: none;
  width: 100%;
  border-top: 1px solid #444;
  margin-top: 5px;
  padding-top: 5px;
}

.timer-options.show { display: block; }

.timer-options button {
  display: block;
  width: 100%;
  min-height: 40px;
  padding: 10px 12px;
  border: none;
  background: transparent;
  color: #19d66b;
  text-align: left;
  font-size: 14px;
  cursor: pointer;
}

/* ADICIONAR */

.add-button {
  width: 100%;
  max-width: 280px;
  padding: 14px;
  background: #19d66b;
  color: #080808;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#status {
  min-height: 20px;
  color: #999;
  font-size: 13px;
  margin-top: 15px;
}

h3 {
  text-align: left;
  margin-top: 38px;
}

/* BIBLIOTECA */

#playlist {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: left;
}

.track {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 9px;
  padding: 10px 8px 10px 14px;
  margin-bottom: 9px;
}

.track.active { border-color: #19d66b; }

.track-name {
  flex: 1;
  min-width: 0;
  padding: 7px 0;
  color: white;
  background: transparent;
  border: none;
  text-align: left;
  font-size: 14px;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.track.active .track-name { color: #19d66b; }

.track-menu-area {
  position: relative;
  flex-shrink: 0;
}

.track-menu-button {
  width: 38px;
  height: 38px;
  background: transparent;
  color: white;
  border: none;
  border-radius: 50%;
  font-size: 25px;
  cursor: pointer;
}

.track-menu {
  right: 0;
  top: 40px;
  width: 190px;
}

.delete-option { color: #ff5555; }

.empty {
  color: #777;
  font-size: 13px;
  padding: 12px 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">PREMIUM <span>MUSIC</span></div>
  <span>🎧</span>
</header>

<main>

  <div class="cover" id="cover">♫</div>

  <h2 id="songName">Nenhuma música selecionada</h2>
  <p id="songInfo">Adicione músicas do seu celular</p>

  <audio id="audioPlayer"></audio>

  <div class="progress-area">
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
    <input type="range" id="progress" min="0" max="1000" value="0">
  </div>

  <div class="controls">
    <button id="shuffleBtn" title="Aleatório">🔀</button>
    <button id="previousBtn" title="Voltar">⏮</button>
    <button id="playBtn" class="play-button">▶</button>
    <button id="nextBtn" title="Avançar">⏭</button>
    <button id="repeatBtn" title="Repetir">🔁</button>
    <button id="muteBtn" title="Silenciar">🔊</button>

    <div class="menu-area">
      <button id="menuBtn" class="menu-button">⋮</button>

      <div class="popup-menu main-menu" id="mainMenu">
        <button class="popup-option" id="timerBtn">
          ⏰ Temporizador
        </button>

        <div class="timer-options" id="timerOptions">
          <button data-minutes="5">5 minutos</button>
          <button data-minutes="10">10 minutos</button>
          <button data-minutes="15">15 minutos</button>
          <button data-minutes="20">20 minutos</button>
          <button data-minutes="30">30 minutos</button>
          <button data-minutes="0">Desativar temporizador</button>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="file" accept="audio/*" multiple hidden>

  <button class="add-button" id="addButton">
    + Adicionar músicas
  </button>

  <p id="status">Preparando biblioteca...</p>

  <h3>Minha biblioteca</h3>
  <ul id="playlist"></ul>

</main>

<!-- Leitor de capas incorporadas nos arquivos -->
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

<script>
const audio = document.getElementById("audioPlayer");
const fileInput = document.getElementById("file");
const playlist = document.getElementById("playlist");

const playBtn = document.getElementById("playBtn");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const muteBtn = document.getElementById("muteBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const repeatBtn = document.getElementById("repeatBtn");

const songName = document.getElementById("songName");
const songInfo = document.getElementById("songInfo");
const status = document.getElementById("status");
const cover = document.getElementById("cover");

const progress = document.getElementById("progress");
const currentTimeLabel = document.getElementById("currentTime");
const durationLabel = document.getElementById("duration");

const menuBtn = document.getElementById("menuBtn");
const mainMenu = document.getElementById("mainMenu");
const timerBtn = document.getElementById("timerBtn");
const timerOptions = document.getElementById("timerOptions");

let songs = [];
let queue = [];
let currentSongId = null;
let nextSongId = 1;
let timer = null;

let shuffle = false;
let repeatMode = 0;
// 0 = desligado
// 1 = repetir música
// 2 = repetir biblioteca

let isSeeking = false;
let db;

/* BANCO DE DADOS LOCAL */

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("PremiumMusicDB", 1);

    request.onupgradeneeded = event => {
      const database = event.target.result;

      if (!database.objectStoreNames.contains("songs")) {
        database.createObjectStore("songs", {
          keyPath: "id"
        });
      }
    };

    request.onsuccess = event => resolve(event.target.result);
    request.onerror = () => reject(request.error);
  });
}

function saveSong(song) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction("songs", "readwrite");
    transaction.objectStore("songs").put({
      id: song.id,
      name: song.name,
      blob: song.blob,
      picture: song.picture || null
    });

    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
  });
}

function removeSavedSong(id) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction("songs", "readwrite");
    transaction.objectStore("songs").delete(id);
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
  });
}

function loadSavedSongs() {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction("songs", "readonly");
    const request = transaction.objectStore("songs").getAll();

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

/* UTILITÁRIOS */

function findSong(id) {
  return songs.find(song => song.id === id);
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return minutes + ":" + String(secs).padStart(2, "0");
}

function getCover(picture) {
  if (!picture || !picture.data) return null;

  const bytes = new Uint8Array(picture.data);
  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return "data:" + picture.format + ";base64," + btoa(binary);
}

function readCover(file) {
  return new Promise(resolve => {
    if (!window.jsmediatags) {
      resolve(null);
      return;
    }

    window.jsmediatags.read(file, {
      onSuccess: result => {
        resolve(getCover(result.tags.picture));
      },
      onError: () => resolve(null)
    });
  });
}

/* CAPA */

function showCover(song) {
  cover.innerHTML = "";

  if (song && song.picture) {
    const img = document.createElement("img");
    img.src = song.picture;
    img.alt = "Capa da música";
    cover.appendChild(img);
  } else {
    cover.textContent = "♫";
  }
}

/* ADICIONAR MÚSICAS */

document.getElementById("addButton").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const files = Array.from(fileInput.files);
  let added = 0;

  for (const file of files) {
    if (!file.type.startsWith("audio/")) continue;

    const song = {
      id: nextSongId++,
      name: file.name.replace(/\.[^/.]+$/, ""),
      blob: file,
      url: URL.createObjectURL(file),
      picture: await readCover(file)
    };

    songs.push(song);

    try {
      await saveSong(song);
      added++;
    } catch (error) {
      status.textContent =
        "Não foi possível salvar uma música. Verifique o espaço disponível.";
    }
  }

  renderPlaylist();

  if (added > 0) {
    status.textContent = added + " música(s) adicionada(s) e salva(s)!";
  } else if (files.length === 0) {
    status.textContent = "Nenhuma música selecionada.";
  }

  fileInput.value = "";
});

/* MOSTRAR BIBLIOTECA */

function renderPlaylist() {
  playlist.innerHTML = "";

  if (songs.length === 0) {
    playlist.innerHTML =
      '<li class="empty">Sua biblioteca está vazia.</li>';
    return;
  }

  songs.forEach(song => {
    const li = document.createElement("li");
    li.className = "track";

    if (song.id === currentSongId) {
      li.classList.add("active");
    }

    const name = document.createElement("button");
    name.className = "track-name";
    name.textContent = song.name;

    name.addEventListener("click", () => {
      playSong(song.id);
      closeAllMenus();
    });

    const menuArea = document.createElement("div");
    menuArea.className = "track-menu-area";

    const dots = document.createElement("button");
    dots.className = "track-menu-button";
    dots.textContent = "⋮";

    const trackMenu = document.createElement("div");
    trackMenu.className = "popup-menu track-menu";

    const playNextOption = document.createElement("button");
    playNextOption.className = "popup-option";
    playNextOption.textContent = "▶ Tocar a seguir";

    playNextOption.addEventListener("click", () => {
      queue.push(song.id);
      status.textContent = "Música adicionada para tocar a seguir!";
      closeAllMenus();
    });

    const deleteOption = document.createElement("button");
    deleteOption.className = "popup-option delete-option";
    deleteOption.textContent = "🗑 Excluir";

    deleteOption.addEventListener("click", () => {
      deleteSong(song.id);
      closeAllMenus();
    });

    dots.addEventListener("click", event => {
      event.stopPropagation();

      const wasOpen = trackMenu.classList.contains("show");
      closeAllMenus();

      if (!wasOpen) trackMenu.classList.add("show");
    });

    trackMenu.appendChild(playNextOption);
    trackMenu.appendChild(deleteOption);

    menuArea.appendChild(dots);
    menuArea.appendChild(trackMenu);

    li.appendChild(name);
    li.appendChild(menuArea);

    playlist.appendChild(li);
  });
}

/* REPRODUZIR */

function playSong(id) {
  const song = findSong(id);
  if (!song) return;

  currentSongId = id;
  audio.src = song.url;

  songName.textContent = song.name;
  songInfo.textContent = "Biblioteca salva no aparelho";

  showCover(song);
  renderPlaylist();

  progress.value = 0;
  currentTimeLabel.textContent = "0:00";
  durationLabel.textContent = "0:00";

  audio.play().catch(() => {
    status.textContent = "Não foi possível reproduzir esta música.";
  });
}

/* PRÓXIMA MÚSICA */

function playNext() {
  while (queue.length > 0) {
    const nextId = queue.shift();

    if (findSong(nextId)) {
      playSong(nextId);
      return;
    }
  }

  if (songs.length === 0) return;

  if (shuffle && songs.length > 1) {
    const available = songs.filter(song => song.id !== currentSongId);
    const randomSong = available[Math.floor(Math.random() * available.length)];
    playSong(randomSong.id);
    return;
  }

  const currentIndex = songs.findIndex(song => song.id === currentSongId);

  if (currentIndex === -1) {
    playSong(songs[0].id);
    return;
  }

  if (currentIndex === songs.length - 1 && repeatMode !== 2) {
    currentSongId = null;
    audio.pause();
    playBtn.textContent = "▶";
    status.textContent = "Playlist finalizada.";
    return;
  }

  const nextIndex = (currentIndex + 1) % songs.length;
  playSong(songs[nextIndex].id);
}

/* ANTERIOR */

previousBtn.addEventListener("click", () => {
  if (songs.length === 0) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  const currentIndex = songs.findIndex(song => song.id === currentSongId);
  const previousIndex = currentIndex <= 0
    ? songs.length - 1
    : currentIndex - 1;

  playSong(songs[previousIndex].id);
});

/* PLAY E PAUSA */

playBtn.addEventListener("click", () => {
  if (songs.length === 0) {
    status.textContent = "Adicione uma música primeiro.";
    return;
  }

  if (currentSongId === null) {
    playSong(songs[0].id);
  } else if (audio.paused) {
    audio.play().catch(() => {
      status.textContent = "Não foi possível reproduzir.";
    });
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
  status.textContent = "Reproduzindo agora";
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
});

/* PROGRESSO DA MÚSICA */

audio.addEventListener("loadedmetadata", () => {
  durationLabel.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  if (!isSeeking && Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = (audio.currentTime / audio.duration) * 1000;
  }

  currentTimeLabel.textContent = formatTime(audio.currentTime);
});

progress.addEventListener("input", () => {
  isSeeking = true;

  if (Number.isFinite(audio.duration)) {
    const newTime = (Number(progress.value) / 1000) * audio.duration;
    currentTimeLabel.textContent = formatTime(newTime);
  }
});

function seekAudio() {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
  }

  isSeeking = false;
}

progress.addEventListener("change", seekAudio);
progress.addEventListener("pointerup", seekAudio);
progress.addEventListener("touchend", seekAudio);

/* REPETIR */

repeatBtn.addEventListener("click", () => {
  repeatMode = (repeatMode + 1) % 3;

  if (repeatMode === 0) {
    repeatBtn.textContent = "🔁";
    repeatBtn.classList.remove("active-control");
    repeatBtn.title = "Repetição desligada";
    status.textContent = "Repetição desligada.";
  } else if (repeatMode === 1) {
    repeatBtn.textContent = "🔂";
    repeatBtn.classList.add("active-control");
    repeatBtn.title = "Repetir música";
    status.textContent = "Repetindo esta música.";
  } else {
    repeatBtn.textContent = "🔁";
    repeatBtn.classList.add("active-control");
    repeatBtn.title = "Repetir playlist";
    status.textContent = "Repetindo a playlist.";
  }
});

/* ALEATÓRIO */

shuffleBtn.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("active-control", shuffle);

  status.textContent = shuffle
    ? "Modo aleatório ativado."
    : "Modo aleatório desativado.";
});

/* FINAL DA MÚSICA */

audio.addEventListener("ended", () => {
  if (repeatMode === 1 && currentSongId !== null) {
    audio.currentTime = 0;
    audio.play();
    return;
  }

  playNext();
});

/* AVANÇAR MANUALMENTE */

nextBtn.addEventListener("click", playNext);

/* MUTE */

muteBtn.addEventListener("click", () => {
  audio.muted = !audio.muted;
  muteBtn.textContent = audio.muted ? "🔇" : "🔊";
});

/* FECHAR MENUS */

function closeAllMenus() {
  mainMenu.classList.remove("show");
  timerOptions.classList.remove("show");

  document.querySelectorAll(".track-menu.show").forEach(menu => {
    menu.classList.remove("show");
  });
}

/* MENU PRINCIPAL */

menuBtn.addEventListener("click", event => {
  event.stopPropagation();

  const wasOpen = mainMenu.classList.contains("show");
  closeAllMenus();

  if (!wasOpen) mainMenu.classList.add("show");
});

/* TEMPORIZADOR */

timerBtn.addEventListener("click", event => {
  event.stopPropagation();
  timerOptions.classList.toggle("show");
});

timerOptions.querySelectorAll("button").forEach(button => {
  button.addEventListener("click", () => {
    clearTimeout(timer);
    timer = null;

    const minutes = Number(button.dataset.minutes);

    if (minutes === 0) {
      status.textContent = "Temporizador desativado.";
    } else {
      status.textContent = "A música vai parar em " + minutes + " minutos.";

      timer = setTimeout(() => {
        audio.pause();
        status.textContent = "Temporizador finalizado. Música pausada.";
        timer = null;
      }, minutes * 60 * 1000);
    }

    closeAllMenus();
  });
});

/* EXCLUIR */

async function deleteSong(id) {
  const index = songs.findIndex(song => song.id === id);
  if (index === -1) return;

  const song = songs[index];

  queue = queue.filter(queuedId => queuedId !== id);

  if (currentSongId === id) {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();

    currentSongId = null;
    songName.textContent = "Nenhuma música selecionada";
    songInfo.textContent = "Adicione músicas do seu celular";
    showCover(null);
    progress.value = 0;
    currentTimeLabel.textContent = "0:00
