
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Premium Music</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252525;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.logo span {
  color: #19d66b;
}

main {
  padding: 20px;
  padding-bottom: 45px;
  text-align: center;
}

.cover {
  width: 210px;
  height: 210px;
  margin: 35px auto 25px;
  border: 2px solid #19d66b;
  border-radius: 22px;
  background: linear-gradient(145deg, #171717, #292929);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 85px;
  color: #19d66b;
}

#songName {
  font-size: 21px;
  overflow-wrap: anywhere;
  margin-bottom: 7px;
}

#songInfo {
  color: #999;
  font-size: 14px;
}

audio {
  display: none;
}

/* CONTROLES DO PLAYER */

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin: 30px auto;
  width: 100%;
}

.controls > button,
.menu-area > button {
  width: 43px;
  height: 45px;
  flex-shrink: 0;
  border: none;
  background: transparent;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.controls .play-button {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #19d66b;
  color: #080808;
  font-size: 26px;
}

.menu-area {
  position: relative;
  flex-shrink: 0;
}

.menu-button {
  font-size: 30px !important;
}

/* MENUS */

.popup-menu {
  display: none;
  position: absolute;
  background: #202020;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 7px;
  z-index: 100;
  box-shadow: 0 8px 25px #0009;
}

.popup-menu.show {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.main-menu {
  top: 48px;
  right: 0;
  width: 220px;
}

.popup-option {
  display: block;
  flex: none;
  width: 100%;
  min-height: 45px;
  padding: 13px 12px;
  margin: 0;
  border: none;
  border-radius: 7px;
  background: transparent;
  color: white;
  text-align: left;
  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 20px;
  white-space: nowrap;
  cursor: pointer;
}

.popup-option:active {
  background: #383838;
}

/* TEMPORIZADOR */

.timer-options {
  display: none;
  width: 100%;
  border-top: 1px solid #444;
  margin-top: 5px;
  padding-top: 5px;
}

.timer-options.show {
  display: block;
}

.timer-options button {
  display: block;
  width: 100%;
  min-height: 40px;
  padding: 10px 12px;
  border: none;
  background: transparent;
  color: #19d66b;
  text-align: left;
  font-size: 14px;
  cursor: pointer;
}

/* ADICIONAR MUSICAS */

.add-button {
  width: 100%;
  max-width: 280px;
  padding: 14px;
  background: #19d66b;
  color: #080808;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

#status {
  min-height: 20px;
  color: #999;
  font-size: 13px;
  margin-top: 15px;
}

h3 {
  text-align: left;
  margin-top: 38px;
}

/* LISTA DE MUSICAS */

#playlist {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: left;
}

.track {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 9px;
  padding: 10px 8px 10px 14px;
  margin-bottom: 9px;
}

.track.active {
  border-color: #19d66b;
}

.track-name {
  flex: 1;
  min-width: 0;
  padding: 7px 0;
  color: white;
  background: transparent;
  border: none;
  text-align: left;
  font-size: 14px;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.track.active .track-name {
  color: #19d66b;
}

.track-menu-area {
  position: relative;
  flex-shrink: 0;
}

.track-menu-button {
  width: 38px;
  height: 38px;
  background: transparent;
  color: white;
  border: none;
  border-radius: 50%;
  font-size: 25px;
  cursor: pointer;
}

.track-menu {
  right: 0;
  top: 40px;
  width: 190px;
}

.delete-option {
  color: #ff5555;
}

.empty {
  color: #777;
  font-size: 13px;
  padding: 12px 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">PREMIUM <span>MUSIC</span></div>
  <span>🎧</span>
</header>

<main>

  <div class="cover">♫</div>

  <h2 id="songName">Nenhuma música selecionada</h2>
  <p id="songInfo">Adicione músicas do seu celular</p>

  <audio id="audioPlayer"></audio>

  <div class="controls">

    <button id="previousBtn" title="Voltar">⏮</button>

    <button id="playBtn" class="play-button" title="Reproduzir">
      ▶
    </button>

    <button id="nextBtn" title="Avançar">⏭</button>

    <button id="muteBtn" title="Silenciar">🔊</button>

    <!-- MENU PRINCIPAL: SOMENTE TEMPORIZADOR -->

    <div class="menu-area">

      <button id="menuBtn" class="menu-button" title="Mais opções">
        ⋮
      </button>

      <div class="popup-menu main-menu" id="mainMenu">

        <button class="popup-option" id="timerBtn">
          ⏰ Temporizador
        </button>

        <div class="timer-options" id="timerOptions">
          <button data-minutes="5">5 minutos</button>
          <button data-minutes="10">10 minutos</button>
          <button data-minutes="15">15 minutos</button>
          <button data-minutes="20">20 minutos</button>
          <button data-minutes="30">30 minutos</button>
          <button data-minutes="0">Desativar temporizador</button>
        </div>

      </div>
    </div>

  </div>

  <input
    type="file"
    id="file"
    accept="audio/*"
    multiple
    hidden
  >

  <button class="add-button" id="addButton">
    + Adicionar músicas
  </button>

  <p id="status"></p>

  <h3>Minha biblioteca</h3>
  <ul id="playlist"></ul>

</main>

<script>
const audio = document.getElementById("audioPlayer");
const fileInput = document.getElementById("file");
const playlist = document.getElementById("playlist");

const playBtn = document.getElementById("playBtn");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const muteBtn = document.getElementById("muteBtn");

const songName = document.getElementById("songName");
const songInfo = document.getElementById("songInfo");
const status = document.getElementById("status");

const menuBtn = document.getElementById("menuBtn");
const mainMenu = document.getElementById("mainMenu");
const timerBtn = document.getElementById("timerBtn");
const timerOptions = document.getElementById("timerOptions");

let songs = [];
let queue = [];
let currentSongId = null;
let nextSongId = 1;
let timer = null;

// ADICIONAR MUSICAS

document.getElementById("addButton").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const files = Array.from(fileInput.files);

  files.forEach(file => {
    if (!file.type.startsWith("audio/")) return;

    songs.push({
      id: nextSongId++,
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: URL.createObjectURL(file)
    });
  });

  renderPlaylist();

  status.textContent = files.length
    ? "Músicas adicionadas à biblioteca!"
    : "Nenhuma música adicionada.";

  fileInput.value = "";
});

// ENCONTRAR MUSICA PELO ID

function findSong(id) {
  return songs.find(song => song.id === id);
}

// MOSTRAR BIBLIOTECA

function renderPlaylist() {
  playlist.innerHTML = "";

  if (songs.length === 0) {
    playlist.innerHTML =
      '<li class="empty">Sua biblioteca está vazia.</li>';
    return;
  }

  songs.forEach(song => {
    const li = document.createElement("li");
    li.className = "track";

    if (song.id === currentSongId) {
      li.classList.add("active");
    }

    const name = document.createElement("button");
    name.className = "track-name";
    name.textContent = song.name;

    name.addEventListener("click", () => {
      playSong(song.id);
      closeAllMenus();
    });

    // TRES PONTINHOS DE CADA MUSICA

    const menuArea = document.createElement("div");
    menuArea.className = "track-menu-area";

    const dots = document.createElement("button");
    dots.className = "track-menu-button";
    dots.textContent = "⋮";
    dots.title = "Opções da música";

    const trackMenu = document.createElement("div");
    trackMenu.className = "popup-menu track-menu";

    const playNextOption = document.createElement("button");
    playNextOption.className = "popup-option";
    playNextOption.textContent = "▶ Tocar a seguir";

    playNextOption.addEventListener("click", () => {
      queue.push(song.id);

      status.textContent =
        "Música adicionada para tocar a seguir!";

      closeAllMenus();
    });

    const deleteOption = document.createElement("button");
    deleteOption.className = "popup-option delete-option";
    deleteOption.textContent = "🗑 Excluir";

    deleteOption.addEventListener("click", () => {
      deleteSong(song.id);
      closeAllMenus();
    });

    dots.addEventListener("click", (event) => {
      event.stopPropagation();

      const wasOpen = trackMenu.classList.contains("show");

      closeAllMenus();

      if (!wasOpen) {
        trackMenu.classList.add("show");
      }
    });

    trackMenu.appendChild(playNextOption);
    trackMenu.appendChild(deleteOption);

    menuArea.appendChild(dots);
    menuArea.appendChild(trackMenu);

    li.appendChild(name);
    li.appendChild(menuArea);

    playlist.appendChild(li);
  });
}

// REPRODUZIR MUSICA

function playSong(id) {
  const song = findSong(id);

  if (!song) return;

  currentSongId = id;
  audio.src = song.url;

  songName.textContent = song.name;
  songInfo.textContent = "Biblioteca do celular";

  renderPlaylist();

  audio.play().catch(() => {
    status.textContent =
      "Não foi possível reproduzir esta música.";
  });
}

// TOCAR PROXIMA MUSICA

function playNext() {
  while (queue.length > 0) {
    const nextId = queue.shift();

    if (findSong(nextId)) {
      playSong(nextId);
      return;
    }
  }

  if (songs.length === 0) return;

  const currentIndex = songs.findIndex(
    song => song.id === currentSongId
  );

  const nextIndex = currentIndex === -1
    ? 0
    : (currentIndex + 1) % songs.length;

  playSong(songs[nextIndex].id);
}

// PLAY E PAUSA

playBtn.addEventListener("click", () => {
  if (songs.length === 0) {
    status.textContent = "Adicione uma música primeiro.";
    return;
  }

  if (currentSongId === null) {
    playSong(songs[0].id);
  } else if (audio.paused) {
    audio.play().catch(() => {
      status.textContent = "Não foi possível reproduzir.";
    });
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
  status.textContent = "Reproduzindo agora";
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
});

// AVANCAR

nextBtn.addEventListener("click", playNext);

// VOLTAR

previousBtn.addEventListener("click", () => {
  if (songs.length === 0) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  const currentIndex = songs.findIndex(
    song => song.id === currentSongId
  );

  const previousIndex = currentIndex <= 0
    ? songs.length - 1
    : currentIndex - 1;

  playSong(songs[previousIndex].id);
});

// AO TERMINAR A MUSICA

audio.addEventListener("ended", playNext);

// MUTE

muteBtn.addEventListener("click", () => {
  audio.muted = !audio.muted;
  muteBtn.textContent = audio.muted ? "🔇" : "🔊";
});

// FECHAR TODOS OS MENUS

function closeAllMenus() {
  mainMenu.classList.remove("show");
  timerOptions.classList.remove("show");

  document.querySelectorAll(".track-menu.show").forEach(menu => {
    menu.classList.remove("show");
  });
}

// MENU PRINCIPAL

menuBtn.addEventListener("click", (event) => {
  event.stopPropagation();

  const wasOpen = mainMenu.classList.contains("show");

  closeAllMenus();

  if (!wasOpen) {
    mainMenu.classList.add("show");
  }
});

// TEMPORIZADOR

timerBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  timerOptions.classList.toggle("show");
});

timerOptions.querySelectorAll("button").forEach(button => {
  button.addEventListener("click", () => {
    clearTimeout(timer);
    timer = null;

    const minutes = Number(button.dataset.minutes);

    if (minutes === 0) {
      status.textContent = "Temporizador desativado.";
    } else {
      status.textContent =
        `A música vai parar em ${minutes} minutos.`;

      timer = setTimeout(() => {
        audio.pause();

        status.textContent =
          "Temporizador finalizado. Música pausada.";

        timer = null;
      }, minutes * 60 * 1000);
    }

    closeAllMenus();
  });
});

// EXCLUIR MUSICA

function deleteSong(id) {
  const index = songs.findIndex(song => song.id === id);

  if (index === -1) return;

  const song = songs[index];

  // Retirar da fila
  queue = queue.filter(queuedId => queuedId !== id);

  // Se for a música atual, parar a reprodução
  if (currentSongId === id) {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();

    currentSongId = null;

    songName.textContent = "Nenhuma música selecionada";
    songInfo.textContent = "Adicione músicas do seu celular";
  }

  URL.revokeObjectURL(song.url);

  songs.splice(index, 1);

  renderPlaylist();

  status.textContent = "Música excluída da biblioteca.";
}

// FECHAR MENU AO CLICAR FORA

document.addEventListener("click", (event) => {
  if (!event.target.closest(".menu-area") &&
      !event.target.closest(".track-menu-area")) {
    closeAllMenus();
  }
});

// INICIAR

renderPlaylist();
</script>

</body>
</html>
