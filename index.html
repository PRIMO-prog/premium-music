<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Premium Music</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111;
  border-bottom: 1px solid #222;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.logo span {
  color: #00c853;
}

header .head-icon {
  color: #e53935;
  font-size: 24px;
}

main {
  padding: 20px;
  padding-bottom: 110px;
  max-width: 650px;
  margin: auto;
}

h2 {
  font-size: 19px;
}

.player {
  background: #151515;
  border: 1px solid #252525;
  border-radius: 20px;
  padding: 24px 18px;
  text-align: center;
  box-shadow: 0 8px 30px #0008;
}

.cover {
  width: 190px;
  height: 190px;
  margin: 0 auto 22px;
  border-radius: 18px;
  background: linear-gradient(135deg, #00c853, #e53935);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 75px;
  color: white;
  box-shadow: 0 0 25px #00c85330;
}

#songName {
  margin-bottom: 8px;
  font-size: 20px;
}

#songInfo {
  color: #999;
  font-size: 14px;
}

button {
  background: #00c853;
  color: #080808;
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.add-button
  .controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin: 25px 0;
}

.controls button {
  width: 48px;
  height: 48px;
  padding: 8px;
  border-radius: 50%;
  font-size: 20px;
}

#playBtn {
  width: 60px;
  height: 60px;
  background: #00c853;
  font-size: 25px;
}

#previousBtn,
#nextBtn,
#muteBtn {
  background: #292929;
  color: white;
}

.timer {
  margin-top: 25px;
  padding: 15px;
  background: #202020;
  border-radius: 12px;
}

.timer h3 {
  font-size: 15px;
  margin-top: 0;
}

.timer select {
  width: 100%;
  padding: 12px;
  background: #111;
  color: white;
  border: 1px solid #00c853;
  border-radius: 9px;
  font-size: 14px;
}{
  margin-top: 15px;
  width: 100%;
  max-width: 240px;
}

.library {
  margin-top: 28px;
  background: #151515;
  border: 1px solid #252525;
  padding: 18px;
  border-radius: 17px;
}

.library h2 {
  margin-top: 0;
}

#playlist {
  margin-top: 15px;
  color: #999;
  font-size: 14px;
}

.empty {
  text-align: center;
  padding: 20px 5px;
  color: #777;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111;
  border-top: 1px solid #292929;
  padding: 15px;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

footer span {
  color: #aaa;
  font-size: 13px;
}

footer span:first-child {
  color: #00c853;
}

.red {
  color: #e53935;
}
</style>
</head>
<audio id="audioPlayer"></audio>
  
<script>
const audio = document.getElementById("audioPlayer");
const fileInput = document.getElementById("file");
const playlist = document.getElementById("playlist");

let songs = [];
let currentIndex = 0;
let timerId = null;

function loadSong(index) {
  if (!songs.length) return;

  currentIndex = index;
  audio.src = songs[currentIndex].url;

  document.getElementById("songName").textContent =
    songs[currentIndex].name;

  document.getElementById("songInfo").textContent =
    "Música " + (currentIndex + 1) + " de " + songs.length;

  updatePlaylist();
  audio.play();
}

function updatePlaylist() {
  playlist.innerHTML = "";

  songs.forEach((song, index) => {
    const item = document.createElement("div");
    item.textContent =
      (index === currentIndex ? "▶ " : "♫ ") + song.name;

    item.style.padding = "12px";
    item.style.borderBottom = "1px solid #333";
    item.style.cursor = "pointer";
    item.style.color =
      index === currentIndex ? "#00c853" : "#fff";

    item.addEventListener("click", () => loadSong(index));
    playlist.appendChild(item);
  });
}

fileInput.addEventListener("change", () => {
  const files = Array.from(fileInput.files);

  files.forEach(file => {
    songs.push({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: URL.createObjectURL(file)
    });
  });

  if (songs.length && !audio.src) {
    loadSong(0);
  } else {
    updatePlaylist();
  }

  fileInput.value = "";
});

document.getElementById("playBtn").addEventListener("click", () => {
  if (!songs.length) {
    fileInput.click();
    return;
  }

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  document.getElementById("playBtn").textContent = "⏸️";
});

audio.addEventListener("pause", () => {
  document.getElementById("playBtn").textContent = "▶️";
});

document.getElementById("nextBtn").addEventListener("click", () => {
  if (songs.length) {
    loadSong((currentIndex + 1) % songs.length);
  }
});

document.getElementById("previousBtn").addEventListener("click", () => {
  if (!songs.length) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else {
    loadSong((currentIndex - 1 + songs.length) % songs.length);
  }
});

audio.addEventListener("ended", () => {
  if (songs.length > 1) {
    loadSong((currentIndex + 1) % songs.length);
  }
});

document.getElementById("muteBtn").addEventListener("click", () => {
  audio.muted = !audio.muted;

  document.getElementById("muteBtn").textContent =
    audio.muted ? "🔇" : "🔊";
});

document.getElementById("sleepTimer").addEventListener("change", event => {
  clearTimeout(timerId);
  timerId = null;

  const minutes = Number(event.target.value);

  if (!minutes) return;

  timerId = setTimeout(() => {
    audio.pause();
    event.target.value = "";
    timerId = null;
  }, minutes * 60 * 1000);
});
</script>
  
<body>

<header>
  <div class="logo">PREMIUM <span>MUSIC</span></div>
  <span class="head-icon">🎧</span>
</header>

<main>

  <section class="player">

    <div class="cover">♫</div>

<div class="controls">

  <button id="previousBtn">⏮️</button>

  <button id="playBtn">▶️</button>

  <button id="nextBtn">⏭️</button>

  <button id="muteBtn">🔊</button>

</div>

<div class="timer">

  <h3>⏱️ Parar música automaticamente</h3>

  <select id="sleepTimer">
    <option value="">Desativado</option>
    <option value="5">5 minutos</option>
    <option value="10">10 minutos</option>
    <option value="15">15 minutos</option>
    <option value="20">20 minutos</option>
  </select>

</div>

    <h2 id="songName">Nenhuma música selecionada</h2>

    <p id="songInfo">Escolha uma música do seu celular</p>

    <input
      type="file"
      id="file"
      accept="audio/*"
      multiple
      hidden
    >

    <button class="add-button"
      onclick="document.getElementById('file').click()">
      + Adicionar músicas
    </button>

  </section>

  <section class="library">

    <h2>Minha biblioteca</h2>

    <div id="playlist">
      <div class="empty">
        Sua biblioteca está vazia.<br>
        Adicione suas músicas para começar!
      </div>
    </div>

  </section>

</main>

<footer>
  <span>⌂ Início</span>
  <span>♫ Biblioteca</span>
  <span class="red">⚙ Ajustes</span>
</footer>

</body>
</html>
