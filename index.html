
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Premium Music</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  padding-bottom: 30px;
}

header {
  padding: 22px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.logo span {
  color: #19d66b;
}

main {
  padding: 20px;
  text-align: center;
}

.cover {
  width: 190px;
  height: 190px;
  background: linear-gradient(145deg, #151515, #222);
  border: 2px solid #19d66b;
  border-radius: 20px;
  margin: 25px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 75px;
  color: #19d66b;
}

#songName {
  font-size: 21px;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

#songInfo {
  color: #999;
  font-size: 14px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin: 25px 0;
}

button, select {
  cursor: pointer;
}

.controls button {
  background: #191919;
  color: white;
  border: 1px solid #333;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 19px;
}

.controls .play-button {
  background: #19d66b;
  color: #080808;
  width: 62px;
  height: 62px;
  font-size: 23px;
  border: none;
}

.add-button {
  background: #19d66b;
  color: #080808;
  border: none;
  border-radius: 10px;
  padding: 13px 20px;
  font-size: 15px;
  font-weight: bold;
  width: 100%;
  max-width: 280px;
}

.timer {
  margin: 25px auto;
}

.timer label {
  display: block;
  margin-bottom: 10px;
  color: #bbb;
}

.timer select {
  background: #191919;
  color: white;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 12px;
  width: 100%;
  max-width: 240px;
}

h3 {
  text-align: left;
  margin-top: 35px;
}

#playlist {
  list-style: none;
  padding: 0;
  text-align: left;
}

#playlist li {
  background: #151515;
  border: 1px solid #252525;
  border-radius: 9px;
  padding: 14px;
  margin-bottom: 9px;
  cursor: pointer;
  overflow-wrap: anywhere;
}

#playlist li.active {
  border-color: #19d66b;
  color: #19d66b;
}

#status {
  color: #999;
  font-size: 13px;
  min-height: 18px;
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PREMIUM <span>MUSIC</span></div>
  <span>🎧</span>
</header>

<main>

  <div class="cover">♫</div>

  <h2 id="songName">Nenhuma música selecionada</h2>
  <p id="songInfo">Adicione músicas do seu celular</p>

  <audio id="audioPlayer"></audio>

  <div class="controls">
    <button id="previousBtn" title="Música anterior">⏮</button>
    <button id="playBtn" class="play-button" title="Reproduzir">▶</button>
    <button id="nextBtn" title="Próxima música">⏭</button>
    <button id="muteBtn" title="Silenciar">🔊</button>
  </div>

  <input
    type="file"
    id="file"
    accept="audio/*"
    multiple
    hidden
  >

  <button class="add-button" id="addButton">
    + Adicionar músicas
  </button>

  <p id="status"></p>

  <div class="timer">
    <label for="sleepTimer">⏰ Temporizador para parar a música</label>
    <select id="sleepTimer">
      <option value="0">Desativado</option>
      <option value="5">5 minutos</option>
      <option value="10">10 minutos</option>
      <option value="15">15 minutos</option>
      <option value="20">20 minutos</option>
    </select>
  </div>

  <h3>Minha biblioteca</h3>
<ul id="playlist"></ul>

<h3>🎶 Tocar a seguir</h3>
<ul id="queue"></ul>

</main>

<script>
const audio = document.getElementById("audioPlayer");
const fileInput = document.getElementById("file");
const addButton = document.getElementById("addButton");
const playlist = document.getElementById("playlist");
const playBtn = document.getElementById("playBtn");
const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");
const muteBtn = document.getElementById("muteBtn");
const songName = document.getElementById("songName");
const songInfo = document.getElementById("songInfo");
const status = document.getElementById("status");
const sleepTimer = document.getElementById("sleepTimer");

let songs = [];
let currentIndex = -1;
let timer = null;
  let queue = [];
const queueElement = document.getElementById("queue");

addButton.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const files = Array.from(fileInput.files);

  files.forEach(file => {
    if (!file.type.startsWith("audio/")) return;

    songs.push({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: URL.createObjectURL(file)
    });
  });

  renderPlaylist();
  status.textContent = files.length
    ? "Músicas adicionadas à biblioteca!"
    : "Nenhuma música adicionada.";

  fileInput.value = "";
});

function renderPlaylist() {
  playlist.innerHTML = "";

  songs.forEach((song, index) => {
    const li = document.createElement("li");
    li.textContent = song.name;

    if (index === currentIndex) {
      li.classList.add("active");
    }

    li.addEventListener("click", () => {
      playSong(index);
    });

    playlist.appendChild(li);
  });
}

function playSong(index) {
  if (index < 0 || index >= songs.length) return;

  currentIndex = index;
  audio.src = songs[index].url;

  songName.textContent = songs[index].name;
  songInfo.textContent = "Biblioteca do celular";

  renderPlaylist();

  audio.play().then(() => {
    playBtn.textContent = "Ⅱ";
    status.textContent = "Reproduzindo agora";
  }).catch(() => {
    playBtn.textContent = "▶";
    status.textContent = "Não foi possível reproduzir esta música.";
  });
}

playBtn.addEventListener("click", () => {
  if (songs.length === 0) {
    status.textContent = "Adicione uma música primeiro.";
    return;
  }

  if (currentIndex === -1) {
    playSong(0);
    return;
  }

  if (audio.paused) {
    audio.play().then(() => {
      playBtn.textContent = "Ⅱ";
      status.textContent = "Reproduzindo agora";
    }).catch(() => {
      status.textContent = "Não foi possível reproduzir esta música.";
    });
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
});

nextBtn.addEventListener("click", () => {
  if (songs.length === 0) return;

  const nextIndex = (currentIndex + 1) % songs.length;
  playSong(nextIndex);
});

previousBtn.addEventListener("click", () => {
  if (songs.length === 0) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  const previousIndex =
    (currentIndex - 1 + songs.length) % songs.length;

  playSong(previousIndex);
});

audio.addEventListener("ended", () => {
  if (songs.length > 1) {
    const nextIndex = (currentIndex + 1) % songs.length;
    playSong(nextIndex);
  } else if (songs.length === 1) {
    playSong(0);
  }
});

muteBtn.addEventListener("click", () => {
  audio.muted = !audio.muted;
  muteBtn.textContent = audio.muted ? "🔇" : "🔊";
});

sleepTimer.addEventListener("change", () => {
  clearTimeout(timer);
  timer = null;

  const minutes = Number(sleepTimer.value);

  if (minutes === 0) {
    status.textContent = "Temporizador desativado.";
    return;
  }

  status.textContent = `A música vai parar em ${minutes} minutos.`;

  timer = setTimeout(() => {
    audio.pause();
    sleepTimer.value = "0";
    status.textContent = "Temporizador finalizado. Música pausada.";
    timer = null;
  }, minutes * 60 * 1000);
});
</script>

</body>
</html>
